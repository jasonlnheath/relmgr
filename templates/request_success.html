{% extends "base.html" %}
{% block title %}Request Sent — {{ profile.display_name }}{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-bold text-green-600 mb-2">✓ Request Sent</h1>
    <p class="text-gray-600 mb-4">
        Your access request has been sent to <strong>{{ profile.display_name }}</strong>.
    </p>
    <p class="text-gray-500 text-sm">
        Grant ID: {{ grant_id }}
    </p>
    <a href="/p/{{ profile.handle }}" class="text-blue-600 hover:underline text-sm mt-4 block">
        ← Back to profile
    </a>
</div>
{% endblock %}
