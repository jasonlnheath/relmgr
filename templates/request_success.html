{% extends "base.html" %}
{% block title %}Request Sent — {{ profile.display_name }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-8 px-4">
    <div class="wl-card p-6">
        <h1 class="wl-heading wl-heading-md mb-2" style="color: var(--wl-success);">✓ Request Sent</h1>
        <p class="wl-text-sub mb-4">
            Your access request has been sent to <strong class="wl-text">{{ profile.display_name }}</strong>.
        </p>
        <p class="wl-text-faint text-sm">
            Grant ID: {{ grant_id }}
        </p>
        <a href="/p/{{ profile.handle }}" class="wl-link text-sm mt-4 block">
            ← Back to profile
        </a>
    </div>
</div>
{% endblock %}
