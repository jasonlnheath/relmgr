<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Whitelist{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arapey:ital@0;1&display=swap" rel="stylesheet">
    <style>
        /* === RelMgr theme tokens (captain rulings 2026-09-18; pairing-review fixes §6) === */
        :root {
            /* Bunny-grey ramp (captain baseline: land as-is per §7) */
            --wl-ink: #0B0B0C;
            --wl-paper: #FFFFFF;
            --wl-charcoal: #333338;
            --wl-charcoal-deep: #2B2B2E;
            --wl-bunny-100: #DDD8D1;
            --wl-bunny-200: #C6BFB5;
            --wl-bunny-400: #A29A8E;
            --wl-bunny-500: #756D62;
            --wl-bunny-700: #5F584E;
            --wl-amber: #6E5616;
            --wl-amber-field: #F5EEDA;
            --wl-danger: #8C2F2F;
            --wl-success: #5F7A5E;

            /* Subtle glass (even more subtle than mockup) */
            --wl-glass-fill: rgba(255,255,255,0.60);
            --wl-glass-blur: 8px;
            --wl-glass-border: rgba(11,11,12,0.10);
        }

        /* Semantic utility classes */
        .wl-page-bg { background: var(--wl-bunny-100); }
        .wl-card { background: var(--wl-paper); border: 1px solid var(--wl-bunny-200); border-radius: 0; }
        .wl-text { color: var(--wl-ink); }
        .wl-text-sub { color: var(--wl-charcoal); }
        .wl-text-muted { color: var(--wl-bunny-700); }
        .wl-text-faint { color: var(--wl-bunny-500); }
        .wl-border { border-color: var(--wl-bunny-200); }
        .wl-link { color: var(--wl-ink); text-decoration: underline; }
        .wl-link:hover { opacity: 0.75; }
        .wl-btn-approve { background: var(--wl-success); color: #FFFFFF; }
        .wl-btn-approve:hover { background: #4E684D; }
        .wl-btn-deny { background: var(--wl-danger); color: #FFFFFF; }
        .wl-btn-deny:hover { background: #7A2828; }
        .wl-btn-revoke { background: #7A5F1E; color: #FFFFFF; }
        .wl-btn-revoke:hover { background: #6A5018; }
        .wl-btn-submit { background: var(--wl-ink); color: var(--wl-paper); }
        .wl-btn-submit:hover { opacity: 0.85; }
        .wl-btn-ink { background: var(--wl-ink); color: var(--wl-paper); }
        .wl-btn-ink:hover { opacity: 0.85; }
        .wl-btn-gray { background: var(--wl-charcoal-deep); color: var(--wl-paper); }
        .wl-btn-gray:hover { opacity: 0.85; }
        .wl-badge-amber { background: var(--wl-amber-field); color: var(--wl-amber); }
        .wl-badge-approved { background: #E8F0E8; color: #3D6B3D; }
        .wl-badge-charcoal { background: #EDEDED; color: var(--wl-charcoal); }
        .wl-badge-danger { background: #F5E8E8; color: var(--wl-danger); }

        /* Glass effect on tabs rail */
        .wl-glass-rail {
            background: var(--wl-glass-fill);
            backdrop-filter: blur(var(--wl-glass-blur));
            -webkit-backdrop-filter: blur(var(--wl-glass-blur));
            border-bottom: 1px solid var(--wl-glass-border);
        }

        /* Heading scale — mockup: h1 30 / h2 22; all Arapey 400 weight */
        .wl-heading { font-family: "Arapey", Georgia, serif; font-weight: 400; color: var(--wl-ink); }
        .wl-heading-sm { font-size: 22px; line-height: 28px; }
        .wl-heading-md { font-size: 30px; line-height: 36px; }
    </style>
</head>
<body class="wl-page-bg min-h-screen">
    <div class="max-w-2xl mx-auto py-8 px-4">
        {% block tabs %}{% endblock %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
