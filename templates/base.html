<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WhiteList{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arapey:ital@0;1&display=swap" rel="stylesheet">
    {# Scroll mark favicon — approved identity mark #}
    <link rel="icon" type="image/png" href="/static/scroll-mark.png">
    <style>
        /* === Whitelist identity tokens (captain approved 2026-09-22) ===
           Source: ~/Downloads/whitelist-identity/design-guide.txt
           Tokens: list-grey=#5A5A62(deep), list-white=#FFFFFF, list-black=#0B0B0C
           surface-base=#1A1A1C, surface-deep=#0B0B0C, glass-01=#FFFFFF0A
           glass-edge=#FFFFFF2E, ink-primary=#FFFFFF, ink-muted=#FFFFFF75
           ink-faint=#FFFFFF42, ink-secondary=#FFFFFFB8
        */
        :root {
            /* Surfaces */
            --wl-surface-base: #1A1A1C;
            --wl-surface-deep: #0B0B0C;
            --wl-surface-true-black: #000000;
            --wl-surface-light: #F4F4F5;

            /* Ink */
            --wl-ink: #FFFFFF;
            --wl-ink-muted: #FFFFFF75;
            --wl-ink-faint: #FFFFFF42;
            --wl-ink-secondary: #FFFFFFB8;

            /* Glass */
            --wl-glass-fill: #FFFFFF0A;
            --wl-glass-fill-alt: #FFFFFF14;
            --wl-glass-edge: #FFFFFF2E;
            --wl-glass-blur: 12px;

            /* Badge trio (scroll silhouette) */
            --wl-badge-white: #FFFFFF;
            --wl-badge-grey: #5A5A62;
            --wl-badge-black: #0B0B0C;

            /* Slate-grey buttons (list-grey family) */
            --wl-btn-slate: rgba(110,110,118,0.35);
            --wl-btn-slate-hover: rgba(110,110,118,0.50);

            /* Action colors (kept for forms) */
            --wl-amber: #F59E0B;
            --wl-amber-field: rgba(245,158,11,0.12);
            --wl-danger: #EF4444;
            --wl-success: #22C55E;
            --wl-success-field: rgba(34,197,94,0.15);

            /* Legacy aliases */
            --wl-bg: var(--wl-surface-base);
            --wl-charcoal: var(--wl-ink-muted);
            --wl-charcoal-deep: var(--wl-ink-faint);
            --wl-glass-border: var(--wl-glass-edge);
        }

        /* Semantic utility classes */
        .wl-page-bg { background: var(--wl-bg); }
        .wl-card {
            background: var(--wl-glass-fill);
            backdrop-filter: blur(var(--wl-glass-blur));
            -webkit-backdrop-filter: blur(var(--wl-glass-blur));
            border: 1px solid var(--wl-glass-edge);
            border-radius: 12px;
        }
        .wl-text { color: var(--wl-ink); }
        .wl-text-sub { color: var(--wl-ink-muted); }
        .wl-text-muted { color: var(--wl-ink-faint); }
        .wl-text-faint { color: var(--wl-ink-faint); }
        .wl-border { border-color: var(--wl-glass-edge); }
        .wl-link { color: var(--wl-ink); text-decoration: underline; }
        .wl-link:hover { opacity: 0.75; }

        /* Dropdowns: every <select> keeps the dark glass background. */
        .wl-select {
            background: rgba(20, 20, 20, 0.92);
            color: var(--wl-ink);
            color-scheme: dark;
            -webkit-appearance: none;
            appearance: none;
        }
        .wl-select option, .wl-select optgroup {
            background: #141414;
            color: var(--wl-ink);
        }

        /* Buttons */
        /* Buttons — style ruling 2026-09-22: NO green or red buttons
           anywhere. Every action button (approve/deny included) wears the
           default slate gray; the class names stay for template stability. */
        .wl-btn-approve { background: var(--wl-btn-slate); color: var(--wl-ink); border: 1px solid var(--wl-glass-edge); }
        .wl-btn-approve:hover { background: var(--wl-btn-slate-hover); }
        .wl-btn-deny { background: var(--wl-btn-slate); color: var(--wl-ink); border: 1px solid var(--wl-glass-edge); }
        .wl-btn-deny:hover { background: var(--wl-btn-slate-hover); }
        .wl-btn-revoke { background: var(--wl-amber); color: #000; }
        .wl-btn-revoke:hover { opacity: 0.85; }
        .wl-btn-punt { background: var(--wl-amber); color: #000; }
        .wl-btn-punt:hover { opacity: 0.85; }
        .wl-btn-submit { background: var(--wl-btn-slate); color: var(--wl-ink); border: 1px solid var(--wl-glass-edge); }
        .wl-btn-submit:hover { background: var(--wl-btn-slate-hover); }
        .wl-btn-ink { background: var(--wl-btn-slate); color: var(--wl-ink); border: 1px solid var(--wl-glass-edge); }
        .wl-btn-ink:hover { background: var(--wl-btn-slate-hover); }
        .wl-btn-gray { background: var(--wl-btn-slate); color: var(--wl-ink); border: 1px solid var(--wl-glass-edge); }
        .wl-btn-gray:hover { background: var(--wl-btn-slate-hover); }

        /* Badge trio — scroll silhouette on colored button background */
        .wl-badge-scroll {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid var(--wl-glass-edge);
            transition: opacity 0.15s;
        }
        button.wl-badge-scroll { cursor: pointer; }
        button.wl-badge-scroll:hover { opacity: 0.8; }
        .wl-badge-scroll img { width: 12px; height: 12px; object-fit: contain; }
        .wl-badge-scroll[data-state="whitelist"] { background: var(--wl-badge-white); }
        .wl-badge-scroll[data-state="whitelist"] svg { color: var(--wl-surface-base); }
        .wl-badge-scroll[data-state="greylist"] { background: var(--wl-badge-grey); }
        .wl-badge-scroll[data-state="greylist"] svg { color: var(--wl-surface-base); }
        .wl-badge-scroll[data-state="blacklist"] { background: var(--wl-badge-black); }
        .wl-badge-scroll[data-state="blacklist"] svg { color: var(--wl-surface-light); }

        /* Legacy badge classes (kept for non-scroll badges like notifications) */
        .wl-badge-amber { background: var(--wl-amber-field); color: var(--wl-amber); }

        /* Glass effect */
        .wl-glass-rail {
            background: var(--wl-glass-fill);
            backdrop-filter: blur(var(--wl-glass-blur));
            -webkit-backdrop-filter: blur(var(--wl-glass-blur));
            border-bottom: 1px solid var(--wl-glass-edge);
        }

        /* Heading scale — all Arapey 400 weight */
        .wl-heading { font-family: "Arapey", Georgia, serif; font-weight: 400; color: var(--wl-ink); }
        .wl-heading-sm { font-size: 22px; line-height: 28px; }
        .wl-heading-md { font-size: 30px; line-height: 36px; }
    </style>
</head>
<body class="wl-page-bg min-h-screen wl-text">
    <div class="max-w-2xl mx-auto py-8 px-4">
        {% block tabs %}{% endblock %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
