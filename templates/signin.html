{% extends "base.html" %}
{% block title %}Sign in — RelMgr{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-16 px-4">
    <div class="wl-card p-8">
        <div class="text-center mb-8">
            <h1 class="wl-heading wl-heading-md mb-2">Sign in</h1>
            <p class="wl-text-sub text-sm">Access your RelMgr dashboard</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 rounded-lg text-sm" style="background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25); color: var(--wl-danger);">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/signin" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium wl-text-sub mb-1">Email</label>
                <input type="email" id="email" name="email" required autofocus
                       class="w-full border border-gray-600 rounded-lg px-3 py-2 text-sm bg-transparent wl-text focus:border-[#E8E8E8] focus:ring-1 focus:ring-[#E8E8E8]"
                       placeholder="you@example.com"
                       value="{{ email | default('') }}">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium wl-text-sub mb-1">Password</label>
                <input type="password" id="password" name="password" required
                       class="w-full border border-gray-600 rounded-lg px-3 py-2 text-sm bg-transparent wl-text focus:border-[#E8E8E8] focus:ring-1 focus:ring-[#E8E8E8]"
                       placeholder="••••••••">
            </div>

            <button type="submit"
                    class="wl-btn-submit w-full py-2.5 rounded-lg text-sm font-medium">
                Sign in
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="wl-text-sub text-sm">
                Don't have an account?
                <a href="/signup" class="wl-link">Create one</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
