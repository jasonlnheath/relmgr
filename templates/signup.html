{% extends "base.html" %}
{% block title %}Create account — RelMgr{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-16 px-4">
    <div class="wl-card p-8">
        <div class="text-center mb-8">
            <h1 class="wl-heading wl-heading-md mb-2">Create account</h1>
            <p class="wl-text-sub text-sm">Set up your RelMgr workspace</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 rounded-lg text-sm" style="background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25); color: var(--wl-danger);">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/signup" class="space-y-4">
            <div>
                <label for="display_name" class="block text-sm font-medium wl-text-sub mb-1">Display name</label>
                <input type="text" id="display_name" name="display_name" required
                       class="w-full border border-gray-600 rounded-lg px-3 py-2 text-sm bg-transparent wl-text focus:border-[#E8E8E8] focus:ring-1 focus:ring-[#E8E8E8]"
                       placeholder="Your name"
                       value="{{ display_name | default('') }}">
            </div>

            <div>
                <label for="handle" class="block text-sm font-medium wl-text-sub mb-1">
                    Handle
                    <span class="wl-text-faint text-xs">(your public URL slug)</span>
                </label>
                <input type="text" id="handle" name="handle" required
                       class="w-full border border-gray-600 rounded-lg px-3 py-2 text-sm bg-transparent wl-text focus:border-[#E8E8E8] focus:ring-1 focus:ring-[#E8E8E8]"
                       placeholder="jane-smith"
                       value="{{ handle | default('') }}">
                <p class="text-xs wl-text-faint mt-1">People will find you at /{handle}</p>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium wl-text-sub mb-1">Email</label>
                <input type="email" id="email" name="email" required
                       class="w-full border border-gray-600 rounded-lg px-3 py-2 text-sm bg-transparent wl-text focus:border-[#E8E8E8] focus:ring-1 focus:ring-[#E8E8E8]"
                       placeholder="you@example.com"
                       value="{{ email | default('') }}">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium wl-text-sub mb-1">Password</label>
                <input type="password" id="password" name="password" required
                       class="w-full border border-gray-600 rounded-lg px-3 py-2 text-sm bg-transparent wl-text focus:border-[#E8E8E8] focus:ring-1 focus:ring-[#E8E8E8]"
                       placeholder="Min 8 characters"
                       minlength="8">
            </div>

            <button type="submit"
                    class="wl-btn-submit w-full py-2.5 rounded-lg text-sm font-medium">
                Create account
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="wl-text-sub text-sm">
                Already have an account?
                <a href="/signin" class="wl-link">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
