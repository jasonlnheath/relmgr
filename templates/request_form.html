{% extends "base.html" %}
{% block title %}Request Access — {{ profile.display_name }}{% endblock %}

{% block content %}
<div class="wl-card p-6">
    <h1 class="wl-heading wl-heading-md mb-2">Request Access</h1>
    <p class="wl-text-sub mb-6">
        Request access to view <strong class="wl-text">{{ profile.display_name }}</strong>'s full contact information.
    </p>

    <form method="POST" action="/p/{{ profile.handle }}/request" class="space-y-4">
        <div>
            <label for="name" class="block text-sm font-medium wl-text-sub">Your Name</label>
            <input type="text" id="name" name="name" required
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-ink focus:ring-ink px-3 py-2 border wl-text">
        </div>
        <div>
            <label for="email" class="block text-sm font-medium wl-text-sub">Your Email</label>
            <input type="email" id="email" name="email" required
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-ink focus:ring-ink px-3 py-2 border wl-text">
        </div>
        <button type="submit"
                class="w-full wl-btn-ink px-4 py-2 rounded-md">
            Send Request
        </button>
    </form>

    <a href="/p/{{ profile.handle }}" class="wl-link text-sm mt-4 block">
        ← Back to profile
    </a>
</div>
{% endblock %}
