{% extends "base.html" %}
{% block title %}Request Access — {{ profile.display_name }}{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Request Access</h1>
    <p class="text-gray-600 mb-6">
        Request access to view <strong>{{ profile.display_name }}</strong>'s full contact information.
    </p>

    <form method="POST" action="/p/{{ profile.handle }}/request" class="space-y-4">
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700">Your Name</label>
            <input type="text" id="name" name="name" required
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 px-3 py-2 border">
        </div>
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Your Email</label>
            <input type="email" id="email" name="email" required
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 px-3 py-2 border">
        </div>
        <button type="submit"
                class="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
            Send Request
        </button>
    </form>

    <a href="/p/{{ profile.handle }}" class="text-blue-600 hover:underline text-sm mt-4 block">
        ← Back to profile
    </a>
</div>
{% endblock %}
